<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        .main{
            display: grid;
            height: 97vh;
            grid-template-columns: repeat(3,auto);
            grid-template-rows: repeat(4,auto);
            grid-gap: 10px;
            margin: 10px;
        }
        .container{
            background-color: crimson;
            border: 2px solid black;
        }
        .box1{
            grid-column: 1/4;
            grid-row: 1/2;
        }
        .box2{
            grid-column: 1/2;
            grid-row: 2/4;

        }
        .box3{
            grid-column: 2/4;
            grid-row: 2/3;

        }
        .box4{
            grid-column: 2/3;
            grid-row: 3/4;

        }
        .box5{
            grid-column: 3/4;
            grid-row: 3/4;

        }
        .box6{
            grid-column: 1/4;
            grid-row: 4/5;

        }
    </style>
</head>
<body>
    <div class="main">
        <div class="container box1">box1</div>
        <div class="container box2">box2</div>
        <div class="container box3">box3</div>
        <div class="container box4">box4</div>
        <div class="container box5">box5</div>
        <div class="container box6">box6</div>
    </div>
</body>
</html>
